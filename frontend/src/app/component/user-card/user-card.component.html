<div class="item-card user-card" (click)="goToProfile()">

  <!-- IMAGE -->
  <div class="image-container">
    <img
      [src]="user.profilePicUrl || '/assets/images/default-profile.png'"
      [alt]="user.username || 'User Image'"
      class="item-image"
    />
  </div>

  <!-- USERNAME -->
  <h1 class="item-name">
    {{ user.username }}
  </h1>

</div>
