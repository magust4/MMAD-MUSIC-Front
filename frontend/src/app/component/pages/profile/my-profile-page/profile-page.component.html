<app-profile-viewer
    [user]="currentUser"
    [reviews]="reviews"
    [isLoading]="isLoading"
    [isReviewsLoading]="isReviewsLoading"
    [errorMessage]="errorMessage"
    [cardComponent]="cardComponent"
    [showLogout]="true"
    [showChangeProfilePicture]="true"
    (logout)="logout()"
    (userList)="openUserList($event)"
    (profilePictureChange)="onProfilePictureSelected($event)">
</app-profile-viewer>
