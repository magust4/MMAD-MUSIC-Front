<app-profile-header-skeleton *ngIf="isLoading"></app-profile-header-skeleton>


<div class="profile-header" *ngIf="!isLoading && user as u">

    <div class="profile-info">

        <div class="profile-picture-container">

            <img class="profile-picture" [src]="u.profilePicUrl || 'assets/images/default-profile.png'"
                alt="Profile picture">

            <ng-container *ngIf="showChangeProfilePicture">

                <label class="profile-picture-edit" title="Change profile picture">

                    <span>Change</span>

                    <input type="file" accept="image/*" hidden (change)="profilePictureSelected($event)">

                </label>

            </ng-container>

        </div>



        <h2 class="username">
            {{u.username}}
        </h2>


        <div class="stats">

            <div class="stat">
                <span>Reviews: </span>
                <strong>{{reviews.length}}</strong>
            </div>
        
            <span class="divider">|</span>
        
            <button mat-button class="stat" (click)="openUserList('Followers', u.followers || [])">
                <span>Followers: </span>
                <strong>{{u.followers?.length || 0}}</strong>
            </button>
        
            <span class="divider">|</span>
        
            <button mat-button class="stat" (click)="openUserList('Following', u.following || [])">
                <span>Following: </span>
                <strong>{{u.following?.length || 0}}</strong>
            </button>
        
            <ng-container *ngIf="showFollow">
                <span class="divider">|</span>
        
                <button mat-button class="stat action" *ngIf="!isFollowing" (click)="followClick()">
                    Follow
                </button>
        
                <button mat-button class="stat action" *ngIf="isFollowing" (click)="unfollowClick()">
                    Unfollow
                </button>
            </ng-container>
        
            <ng-container *ngIf="showLogout">
                <span class="divider">|</span>
        
                <button mat-button class="stat action" (click)="logoutClick()">
                    Logout
                </button>
            </ng-container>
        
        </div>


    </div>

</div>


<app-review-viewer [reviews]="reviews" [cardComponent]="cardComponent" [isLoading]="isReviewsLoading"
    [errorMessage]="errorMessage">

</app-review-viewer>
